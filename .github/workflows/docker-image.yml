name: Docker Compose Simple Check

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Start containers
        # --wait prüft automatisch, ob die Container erfolgreich "Up" sind
        run: docker compose up -d --build --wait

      - name: Verify Running State
        # Ein einfacher Check, um die Liste der laufenden Container im Log zu sehen
        run: docker compose ps

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop and Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans